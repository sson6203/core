<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="QSD · View Point · 케이블 판독기 · 스피커 리깅 계산기를 하나로 모은 음향 현장 도구">
<title>음향 현장 도구</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1419'/%3E%3Cpath d='M15 38c9-16 25-16 34 0' fill='none' stroke='%234f9eff' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='38' r='6' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eef1f5;
  --text: #121821;
  --muted: #5b6676;
  --border: #d9dee6;
  --accent: #2463eb;
  --accent-soft: #e5edfd;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 16px rgba(16, 24, 40, .06);
  --bar-h: 52px;
  --c-qsd: #2f7de1;
  --c-viewpoint: #7a4ee0;
  --c-cable: #d9730d;
  --c-rigging: #198754;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1419;
    --surface: #151c25;
    --surface-2: #1b2430;
    --text: #e8edf3;
    --muted: #9aa6b5;
    --border: #283342;
    --accent: #4f9eff;
    --accent-soft: #1a2a40;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
    --c-qsd: #4f9eff;
    --c-viewpoint: #a383f5;
    --c-cable: #f0953a;
    --c-rigging: #3fbf7f;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1419;
  --surface: #151c25;
  --surface-2: #1b2430;
  --text: #e8edf3;
  --muted: #9aa6b5;
  --border: #283342;
  --accent: #4f9eff;
  --accent-soft: #1a2a40;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
  --c-qsd: #4f9eff;
  --c-viewpoint: #a383f5;
  --c-cable: #f0953a;
  --c-rigging: #3fbf7f;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
}
button { font: inherit; color: inherit; }

.bar {
  flex: none;
  height: var(--bar-h);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 2;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  padding: 6px 8px 6px 4px;
  border: 0;
  background: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -.01em;
}
.brand:hover { background: var(--surface-2); }
.brand svg { width: 26px; height: 26px; flex: none; }
.tabs {
  display: flex;
  gap: 4px;
  flex: 1 1 auto;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none;
  display: flex;
  align-items: center;
  gap: 7px;
  height: 36px;
  padding: 0 12px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: none;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  font-size: 14px;
  font-weight: 600;
}
.tab:hover { background: var(--surface-2); color: var(--text); }
.tab[aria-current="page"] {
  background: var(--accent-soft);
  color: var(--text);
  border-color: color-mix(in srgb, var(--accent) 35%, transparent);
}
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.tab .ver { font-weight: 500; font-size: 12px; color: var(--muted); }
.bar-actions { display: flex; gap: 6px; flex: none; }
.icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
}
.icon-btn:hover { color: var(--text); background: var(--surface-2); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn[hidden] { display: none; }

.stage { flex: 1 1 auto; position: relative; min-height: 0; }
.view { position: absolute; inset: 0; }
.view[hidden] { display: none; }
.frame { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

.home { overflow-y: auto; padding: 32px 16px 48px; }
.home-inner { max-width: 1040px; margin: 0 auto; }
.home h1 { font-size: 24px; line-height: 1.3; margin: 0 0 6px; letter-spacing: -.02em; }
.home .lead { color: var(--muted); margin: 0 0 24px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  text-align: left;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .12s ease, border-color .12s ease;
}
.card:hover { transform: translateY(-2px); border-color: var(--c); }
.card:focus-visible, .tab:focus-visible, .brand:focus-visible, .icon-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.card-icon {
  width: 44px;
  height: 44px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 14%, transparent);
}
.card-icon svg { width: 26px; height: 26px; }
.card-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card-title strong { font-size: 17px; letter-spacing: -.01em; }
.chip {
  font-size: 12px;
  font-weight: 600;
  padding: 1px 8px;
  border-radius: 999px;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 12%, transparent);
}
.card p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.card .open { font-size: 13px; font-weight: 600; color: var(--c); }
.note { margin-top: 28px; color: var(--muted); font-size: 13px; }
.note p { margin: 4px 0; }

.loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--muted);
  font-size: 14px;
}
.loading[hidden] { display: none; }
.spinner {
  width: 28px;
  height: 28px;
  margin: 0 auto 10px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 720px) {
  .brand-name, .tab .ver, .icon-btn .label { display: none; }
  .bar { gap: 6px; }
  .tab { padding: 0 10px; }
  .home { padding-top: 22px; }
  .home h1 { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
  .spinner { animation-duration: 2.4s; }
}
</style>
</head>
<body>
<header class="bar">
  <button class="brand" type="button" data-go="home" title="처음 화면">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0f1419"/><path d="M15 38c9-16 25-16 34 0" fill="none" stroke="#4f9eff" stroke-width="6" stroke-linecap="round"/><circle cx="32" cy="38" r="6" fill="#fff"/></svg>
    <span class="brand-name">음향 현장 도구</span>
  </button>
  <nav class="tabs" id="tabs" aria-label="도구 카테고리"></nav>
  <div class="bar-actions">
    <button class="icon-btn" type="button" id="popoutBtn" hidden title="이 도구만 새 탭에서 열기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      <span class="label">새 탭</span>
    </button>
  </div>
</header>

<main class="stage" id="stage">
  <section class="view home" id="view-home" aria-labelledby="homeTitle">
    <div class="home-inner">
      <h1 id="homeTitle">어떤 작업을 할까요?</h1>
      <p class="lead">카테고리를 누르면 해당 도구가 바로 열립니다. 위쪽 탭으로 언제든 다른 도구로 옮겨 갈 수 있고, 입력하던 내용은 탭을 옮겨도 그대로 남아 있습니다.</p>
      <div class="cards" id="cards"></div>
      <div class="note">
        <p>모든 도구가 이 파일 하나에 들어 있어 인터넷 연결 없이 동작합니다.</p>
        <p>각 도구의 자동 저장 내용은 지금 쓰는 브라우저에 보관됩니다. 다른 기기로 옮기려면 각 도구의 저장·내보내기 기능을 쓰세요.</p>
        <p id="buildInfo"></p>
      </div>
    </div>
  </section>
  <div class="loading" id="loading" hidden><div><div class="spinner"></div><span id="loadingText">불러오는 중…</span></div></div>
</main>

<!--TOOL_SOURCES-->

<script>
(function () {
  "use strict";

  const ICONS = {
    qsd: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="14" r="3.2"/><circle cx="12" cy="7.5" r="1.2"/></svg>',
    viewpoint: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    cable: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4M15 3v4"/><rect x="6" y="7" width="12" height="6" rx="1.5"/><path d="M12 13v3a4 4 0 0 1-4 4H5"/></svg>',
    rigging: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h16"/><path d="M12 3v5"/><path d="M12 8a2.5 2.5 0 1 1-2.5 2.5"/><rect x="7" y="14" width="10" height="7" rx="1.5"/></svg>'
  };

  const TOOLS = /*TOOLS_META*/[];
  const BUILD = /*BUILD_INFO*/{};

  const tabsEl = document.getElementById("tabs");
  const cardsEl = document.getElementById("cards");
  const stage = document.getElementById("stage");
  const loading = document.getElementById("loading");
  const loadingText = document.getElementById("loadingText");
  const popoutBtn = document.getElementById("popoutBtn");
  const homeView = document.getElementById("view-home");
  const views = { home: homeView };
  const sources = new Map();
  let current = null;

  document.getElementById("buildInfo").textContent = BUILD.text || "";

  function esc(text) {
    return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function toolById(id) {
    return TOOLS.find((t) => t.id === id) || null;
  }

  function sourceOf(id) {
    if (!sources.has(id)) {
      const node = document.getElementById("src-" + id);
      sources.set(id, JSON.parse(node.textContent));
      node.remove();
    }
    return sources.get(id);
  }

  for (const t of TOOLS) {
    const tab = document.createElement("button");
    tab.type = "button";
    tab.className = "tab";
    tab.dataset.go = t.id;
    tab.style.setProperty("--c", "var(--c-" + t.id + ")");
    tab.innerHTML = '<span class="dot"></span>' + esc(t.short) + (t.version ? ' <span class="ver">' + esc(t.version) + "</span>" : "");
    tabsEl.appendChild(tab);

    const card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.dataset.go = t.id;
    card.style.setProperty("--c", "var(--c-" + t.id + ")");
    card.innerHTML =
      '<span class="card-icon" aria-hidden="true">' + ICONS[t.id] + "</span>" +
      '<span class="card-title"><strong>' + esc(t.name) + "</strong>" + (t.version ? '<span class="chip">' + esc(t.version) + "</span>" : "") + "</span>" +
      "<p>" + esc(t.desc) + "</p>" +
      '<span class="open">열기 →</span>';
    cardsEl.appendChild(card);
  }

  document.addEventListener("click", (event) => {
    const target = event.target.closest("[data-go]");
    if (!target) return;
    const id = target.dataset.go;
    if (location.hash.slice(1) === id || (id === "home" && !location.hash)) {
      show(id);
    } else {
      location.hash = id === "home" ? "" : id;
    }
  });

  function ensureFrame(tool) {
    if (views[tool.id]) return views[tool.id];
    const wrap = document.createElement("section");
    wrap.className = "view";
    wrap.id = "view-" + tool.id;
    wrap.setAttribute("aria-label", tool.name);
    const frame = document.createElement("iframe");
    frame.className = "frame";
    frame.title = tool.name;
    wrap.appendChild(frame);
    stage.insertBefore(wrap, loading);
    views[tool.id] = wrap;

    loadingText.textContent = tool.name + " 불러오는 중…";
    loading.hidden = false;
    frame.addEventListener("load", () => {
      if (current === tool.id) loading.hidden = true;
      wrap.dataset.ready = "1";
      if (current === tool.id) frame.focus();
    }, { once: true });
    // 큰 문서를 넣기 전에 로딩 표시가 먼저 그려지도록 한 프레임 미룬다.
    requestAnimationFrame(() => setTimeout(() => { frame.srcdoc = sourceOf(tool.id); }, 0));
    return wrap;
  }

  function show(id) {
    const tool = toolById(id);
    if (!tool) id = "home";
    if (current === id) return;
    current = id;

    if (tool) ensureFrame(tool);
    for (const [key, view] of Object.entries(views)) view.hidden = key !== id;
    loading.hidden = !tool || views[id].dataset.ready === "1";

    for (const tab of tabsEl.querySelectorAll(".tab")) {
      if (tab.dataset.go === id) {
        tab.setAttribute("aria-current", "page");
        tab.scrollIntoView({ block: "nearest", inline: "nearest" });
      } else {
        tab.removeAttribute("aria-current");
      }
    }
    popoutBtn.hidden = !tool;
    document.title = tool ? tool.name + " · 음향 현장 도구" : "음향 현장 도구";
    if (tool && views[id].dataset.ready === "1") views[id].querySelector("iframe").focus();
  }

  popoutBtn.addEventListener("click", () => {
    const tool = toolById(current);
    if (!tool) return;
    const url = URL.createObjectURL(new Blob([sourceOf(tool.id)], { type: "text/html;charset=utf-8" }));
    window.open(url, "_blank", "noopener");
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  });

  function route() {
    show(decodeURIComponent(location.hash.slice(1)) || "home");
  }

  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
